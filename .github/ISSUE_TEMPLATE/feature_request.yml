name: Feature Request
description: Propose a new feature or improvement to Forge.
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** search [open issues](https://github.com/TushaeBXN/anthos-engineer/issues) first.
        Feature requests that duplicate an existing open issue will be closed as duplicates.

        If your idea needs community input before it becomes a concrete proposal,
        start a [discussion](https://github.com/TushaeBXN/anthos-engineer/discussions/categories/ideas) instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched [open issues](https://github.com/TushaeBXN/anthos-engineer/issues?q=is%3Aissue+is%3Aopen) and this has not already been proposed.
          required: true
        - label: I searched [discussions](https://github.com/TushaeBXN/anthos-engineer/discussions) and this is not already being debated there.
          required: true
        - label: This is a concrete, actionable proposal — not a vague "it would be nice if..." request.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Forge does this affect?
      options:
        - "-- Please Select --"
        - System Model / Graph
        - Permission Broker / Policy
        - Capability Executor
        - Verification Chain
        - Semantic Diff
        - LLM Planner
        - Provider Support
        - CLI
        - Testing / CI
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve or what use case does it enable? Be specific.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the behaviour or change you want to see. Include API shape, policy format, or code snippets if that helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider and why did you rule them out?

  - type: textarea
    id: prior-art
    attributes:
      label: Prior Art / Related Issues
      description: Link any related issues, discussions, or external references.

  - type: dropdown
    id: willing_to_implement
    attributes:
      label: Are you willing to implement this?
      options:
        - "-- Please Select --"
        - "Yes — I can open a PR"
        - "Partially — I can help but need guidance"
        - "No — I am only filing the request"
    validations:
      required: true
