[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anthos-engineer"
version = "2.0.0"
description = "Anthos Engineer — standalone agentic coding system powered by local Ollama models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
anthos-engineer = "anthos_engineer.server:serve"

[tool.hatch.build.targets.wheel]
packages = ["anthos_engineer"]

[tool.uv]
required-version = ">=0.4.0"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
