# Forge policy: workspace-write
# Made by `forge policy use workspace-write`, plus verify's commands for this repo. Edit it freely; rules are tried in order and the first match decides.
# Forge reads and edits files in this project. It asks before shell commands, commits, pushes, web access, MCP tools and files outside the project.
# Rule reference: https://github.com/TushaeBXN/anthos-engineer#permissions
version: 1
default: deny

rules:
  # Never read or write credentials: reading them would send them to the model.
  - id: deny-ssh
    resource: filesystem
    operation: "*"
    target: "~/.ssh/**"
    effect: deny

  - id: deny-aws
    resource: filesystem
    operation: "*"
    target: "~/.aws/**"
    effect: deny

  - id: deny-gnupg
    resource: filesystem
    operation: "*"
    target: "~/.gnupg/**"
    effect: deny

  # .env files usually hold keys: ask before reading one.
  - id: ask-env-files
    resource: filesystem
    operation: read
    target: "**/.env"
    effect: allow
    requires_approval: true

  - id: ask-env-variants
    resource: filesystem
    operation: read
    target: "**/.env.*"
    effect: allow
    requires_approval: true

  # Files outside this project: ask, for reading and writing.
  - id: ask-outside-project
    resource: filesystem
    operation: "*"
    target: "/**"
    effect: allow
    requires_approval: true

  - id: allow-project-reads
    resource: filesystem
    operation: read
    target: "**"
    effect: allow

  - id: allow-project-writes
    resource: filesystem
    operation: write
    target: "**"
    effect: allow

  # Git: look and stage freely; commit and push ask (no rule); never force-push or push to main.
  # Never rewrite shared history.
  - id: deny-force-push
    resource: git
    operation: force-push
    target: "**"
    effect: deny

  - id: deny-push-main
    resource: git
    operation: push
    target: "main"
    effect: deny

  - id: deny-push-master
    resource: git
    operation: push
    target: "master"
    effect: deny

  - id: allow-git-status
    resource: git
    operation: status
    target: "**"
    effect: allow

  - id: allow-git-diff
    resource: git
    operation: diff
    target: "**"
    effect: allow

  - id: allow-git-log
    resource: git
    operation: log
    target: "**"
    effect: allow

  - id: allow-git-show
    resource: git
    operation: show
    target: "**"
    effect: allow

  - id: allow-git-rev-parse
    resource: git
    operation: rev-parse
    target: "**"
    effect: allow

  - id: allow-git-add
    resource: git
    operation: add
    target: "**"
    effect: allow

  # This repo: verify's three commands run without asking (type check, tests, lint).
  - id: allow-tsc
    resource: shell
    operation: npx tsc
    target: "*"
    effect: allow

  - id: allow-tests
    resource: shell
    operation: npm test
    target: "*"
    effect: allow

  - id: allow-eslint
    resource: shell
    operation: npx eslint
    target: "*"
    effect: allow

  # Any other shell command has no rule, so it asks. To stop asking for one, allow it, e.g.:
  #
  #   - id: allow-tests
  #     resource: shell
  #     operation: npm test
  #     target: "*"
  #     effect: allow
  #
  # Forge can edit package.json, so allowing "npm test" or "npm run" lets it run any script it writes.

  # Web search, web fetch and MCP tools have no rule, so Forge asks. To allow web search:
  #
  #   - id: allow-web-search
  #     resource: network
  #     operation: search
  #     target: duckduckgo.com
  #     effect: allow
