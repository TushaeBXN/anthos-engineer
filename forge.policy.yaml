version: 1
default: deny

rules:
  # Hard deny: SSH directory is never writable by any agent
  - id: deny-ssh-writes
    resource: filesystem
    operation: write
    target: "~/.ssh/**"
    effect: deny

  # Hard deny: credentials and secrets
  - id: deny-secrets-writes
    resource: filesystem
    operation: write
    target: "~/.aws/**"
    effect: deny

  # Allow: agents may read any file
  - id: allow-all-reads
    resource: filesystem
    operation: read
    target: "**"
    effect: allow

  # Allow: agents may write within src/
  - id: allow-src-writes
    resource: filesystem
    operation: write
    target: "src/**"
    effect: allow

  # Allow: agents may write within model/, policy/, capability/, executor/, diff/, verify/, cli/
  - id: allow-forge-module-writes
    resource: filesystem
    operation: write
    target: "{model,policy,capability,executor,diff,verify,cli}/**"
    effect: allow

  # Allow: test runner
  - id: allow-test-runner
    resource: shell
    operation: npm test
    target: "*"
    effect: allow

  # Allow: type checker
  - id: allow-tsc
    resource: shell
    operation: npx tsc
    target: "*"
    effect: allow

  # Hard deny: force-push is never allowed, regardless of branch
  - id: deny-git-force-push
    resource: git
    operation: force-push
    target: "**"
    effect: deny

  # Hard deny: never push to main or master directly
  - id: deny-push-main
    resource: git
    operation: push
    target: "main"
    effect: deny

  - id: deny-push-master
    resource: git
    operation: push
    target: "master"
    effect: deny

  # Requires approval: git push to a forge/* branch
  - id: require-approval-git-push
    resource: git
    operation: push
    target: "forge/**"
    effect: allow
    requires_approval: true

  # Requires approval: commit (staging + committing implies a visible change)
  - id: require-approval-git-commit
    resource: git
    operation: commit
    target: "**"
    effect: allow
    requires_approval: true

  # Allow: stage specific files (agent must name the paths — no git add -A)
  - id: allow-git-add
    resource: git
    operation: add
    target: "**"
    effect: allow

  # Allow: create a forge/* branch
  - id: allow-git-branch
    resource: git
    operation: branch
    target: "forge/**"
    effect: allow

  # Allow: git read operations
  - id: allow-git-status
    resource: git
    operation: status
    target: "**"
    effect: allow

  - id: allow-git-log
    resource: git
    operation: log
    target: "**"
    effect: allow

  - id: allow-git-diff
    resource: git
    operation: diff
    target: "**"
    effect: allow

  - id: allow-git-rev-parse
    resource: git
    operation: rev-parse
    target: "**"
    effect: allow
