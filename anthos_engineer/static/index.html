<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anthos Engineer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">⚙</div>
        <div>
          <h1>Anthos Engineer</h1>
          <p id="modelLabel">local</p>
        </div>
      </div>

      <div class="sidebar-section">
        <label>Model</label>
        <select id="modelSelect">
          <option value="amy">amy</option>
        </select>
        <div id="ollamaStatus" class="ollama-status"></div>
      </div>

      <div class="sidebar-section history-section">
        <label>Sessions</label>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </aside>

    <main class="main">
      <!-- Engineer home view -->
      <div id="homeView" class="home-view">
        <div class="home-center">
          <div class="hero-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
              <polyline points="7 8 10 11 7 14"/>
              <line x1="13" y1="14" x2="17" y2="14"/>
            </svg>
          </div>
          <h2>What do you want to build?</h2>
          <p>Describe your goal and Anthos Engineer will plan and build it using your local models.</p>
        </div>
      </div>

      <!-- Engineer session view -->
      <div id="sessionView" class="session-view" hidden>
        <div class="session-header">
          <h2 id="sessionGoal"></h2>
          <span id="sessionStatus" class="status-chip"></span>
        </div>

        <div id="planSection" class="plan-section" hidden>
          <h3>Plan</h3>
          <ol id="planList" class="plan-list"></ol>
        </div>

        <div id="logSection" class="log-section">
          <h3>Execution</h3>
          <div id="logFeed" class="log-feed"></div>
        </div>

        <div id="filesSection" class="files-section" hidden>
          <h3>Files Created</h3>
          <ul id="filesList" class="files-list"></ul>
          <p id="workspacePath" class="workspace-path"></p>
        </div>
      </div>

      <footer class="input-bar">
        <div class="input-wrap">
          <textarea
            id="goalInput"
            placeholder="Describe what you want to build…"
            rows="1"
          ></textarea>
          <button id="runBtn" class="run-btn">Build</button>
        </div>
      </footer>
    </main>

    <!-- Preview panel — flex sibling of main inside .shell -->
    <div id="previewPanel" class="preview-panel" hidden>
      <div class="preview-header">
        <span id="previewTitle" class="preview-title"></span>
        <div class="preview-header-actions">
          <button id="previewOpenBtn" class="preview-action-btn">Open in Browser</button>
          <button id="previewDownloadBtn" class="preview-action-btn">Download</button>
          <button id="previewCloseBtn" class="preview-close-btn">✕</button>
        </div>
      </div>
      <div class="preview-body">
        <iframe id="previewFrame" class="preview-frame"></iframe>
        <pre id="previewCode" class="preview-code" hidden></pre>
      </div>
    </div>
  </div><!-- /.shell -->

  <script src="/static/app.js"></script>
</body>
</html>
