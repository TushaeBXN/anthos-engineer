<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anthos Engineer Admin</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Center -->
              <circle cx="13" cy="13" r="3" fill="#ffffff"/>
              <!-- Petals -->
              <ellipse cx="13" cy="5.5" rx="2.2" ry="3.8" fill="#ffffff" opacity="0.9"/>
              <ellipse cx="13" cy="20.5" rx="2.2" ry="3.8" fill="#ffffff" opacity="0.9"/>
              <ellipse cx="5.5" cy="13" rx="3.8" ry="2.2" fill="#ffffff" opacity="0.9"/>
              <ellipse cx="20.5" cy="13" rx="3.8" ry="2.2" fill="#ffffff" opacity="0.9"/>
              <ellipse cx="7.4" cy="7.4" rx="2.2" ry="3.8" fill="#ffffff" opacity="0.75" transform="rotate(-45 7.4 7.4)"/>
              <ellipse cx="18.6" cy="7.4" rx="2.2" ry="3.8" fill="#ffffff" opacity="0.75" transform="rotate(45 18.6 7.4)"/>
              <ellipse cx="7.4" cy="18.6" rx="2.2" ry="3.8" fill="#ffffff" opacity="0.75" transform="rotate(45 7.4 18.6)"/>
              <ellipse cx="18.6" cy="18.6" rx="2.2" ry="3.8" fill="#ffffff" opacity="0.75" transform="rotate(-45 18.6 18.6)"/>
            </svg>
          </div>
          <div>
            <h1>Anthos Engineer</h1>
            <p>Agent Control</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Admin views"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">Providers</h2>
          </div>
        </header>

        <div id="adminViews" class="admin-views">
          <section id="view-providers" class="admin-view active" data-view="providers">
            <section class="provider-strip" aria-label="Provider status">
              <div class="strip-header">
                <h3>Providers</h3>
              </div>
              <div id="providerGrid" class="provider-grid"></div>
            </section>
            <div
              id="providersSections"
              class="form-sections"
              aria-label="Provider configuration"
            ></div>
          </section>

          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div
              id="modelConfigSections"
              class="form-sections"
              aria-label="Model configuration"
            ></div>
          </section>

          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div
              id="messagingSections"
              class="form-sections"
              aria-label="Messaging configuration"
            ></div>
          </section>
        </div>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">No changes</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button id="validateButton" class="secondary-button" type="button">Validate</button>
          <button id="applyButton" class="primary-button" type="button" disabled>Apply</button>
        </div>
      </footer>
    </div>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
